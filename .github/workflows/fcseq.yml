name: FCSEQ native distributions
on:
  workflow_dispatch:
  push:
    paths: ['tools/fcseq/src/**', 'tools/fcseq/vendor/**', 'tools/fcseq/tests/**', 'tools/fcseq/scripts/**', 'tools/fcseq/build.rs', 'tools/fcseq/Cargo.*', '.github/workflows/fcseq.yml']
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-x86_64}
          - {os: ubuntu-24.04, platform: linux-x86_64}
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x86_64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/fcseq
    env:
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev mesa-vulkan-drivers xvfb
      - name: Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
      - uses: actions/cache@v4
        with:
          path: tools/fcseq/target
          key: fcseq-${{ matrix.platform }}-rust1931-${{ hashFiles('tools/fcseq/Cargo.lock') }}
      - name: Test model and editor
        run: python scripts/rust_tests.py
      - name: Build GUI CLI and Python extension
        run: |
          cargo build --locked --release --bins
          cargo build --locked --release --features python --lib
      - name: Native functional verification and package
        run: python scripts/native_package.py --platform ${{ matrix.platform }} --output dist
      - name: GUI startup on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/gui_startup.py dist/${{ matrix.platform }}
      - name: GUI startup on Windows and macOS
        if: runner.os != 'Linux'
        run: python scripts/gui_startup.py dist/${{ matrix.platform }}
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fcseq-diagnostics-${{ matrix.platform }}
          path: tools/fcseq/dist/${{ matrix.platform }}/verification/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified native package
        uses: actions/upload-artifact@v4
        with:
          name: fcseq-${{ matrix.platform }}
          path: tools/fcseq/dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
